services:

  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: GestionOrdinateursDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - appnet

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    command: start-dev
    ports:
      - "8180:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - appnet


  authentification-keycloak-api:
    image: ${DOCKER_ACCOUNT}/authentification-keycloak-api:latest
    build:
      context: .
      dockerfile: AuthentificationKeycloakApi/Dockerfile
    ports:
      - "5035:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Keycloak__BaseUrl: http://keycloak:8080
      Keycloak__Realm: my-realm
      Keycloak__ClientId: my-client
      Keycloak__ClientSecret: ${KEYCLOAK_CLIENT_SECRET}
    depends_on:
      - keycloak
    networks:
      - appnet

  gestionordinateurs-api:
    image: ${DOCKER_ACCOUNT}/gestionordinateurs-api:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.API/Dockerfile
    ports:
      - "5010:8080"
      - "5041:8080"
    environment:
      Keycloak__BaseUrl: http://keycloak:8080
      Keycloak__Realm: my-realm
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    networks:
      - appnet

  authentification-api:
    image: ${DOCKER_ACCOUNT}/authentificationapi:latest
    build:
      context: .
      dockerfile: AuthentificationApi/Dockerfile
    ports:
      - "5025:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      - gestionordinateurs-api
      - keycloak
    networks:
      - appnet

  gestionordinateurs-gateway:
    image: ${DOCKER_ACCOUNT}/gestionordinateurs-gateway:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.Gateway/Dockerfile
    ports:
      - "5127:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ReverseProxy__Clusters__gestionApi__Destinations__api__Address: "http://gestionordinateurs-api:8080/"
    depends_on:
      - gestionordinateurs-api
    networks:
      - appnet

  gestionordinateurs-client:
    image: ${DOCKER_ACCOUNT}/gestionordinateurs-client:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.Client/Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - gestionordinateurs-gateway
    networks:
      - appnet

volumes:
  postgres_data:
  keycloak_data:

networks:
  appnet:
    driver: bridge